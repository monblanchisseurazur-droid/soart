<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | SoArt Atelier</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Styles épurés pour le diaporama (Lightbox) */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(17, 17, 17, 0.95);
            align-items: center;
            justify-content: center;
        }
        .lightbox-content {
            position: relative;
            max-width: 85%;
            max-height: 85%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Toutes les images du diaporama sont superposées, seule l'active est visible */
        .lightbox-img {
            display: none;
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .lightbox-img.active {
            display: block;
        }
        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            font-weight: 300;
            transition: opacity 0.2s;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 35px;
            cursor: pointer;
            user-select: none;
            background: rgba(0,0,0,0.2);
            padding: 10px 15px;
            transition: background 0.2s;
            z-index: 1010;
        }
        .lightbox-prev { left: -60px; }
        .lightbox-next { right: -60px; }
        .lightbox-nav:hover, .lightbox-close:hover { opacity: 0.7; }
        
        /* Ajustement de la carte cliquable */
        .clickable-card {
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .clickable-card:hover {
            transform: translateY(-2px);
        }
        .clickable-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 768px) {
            .lightbox-prev { left: 10px; background: rgba(0,0,0,0.5); }
            .lightbox-next { right: 10px; background: rgba(0,0,0,0.5); }
            .lightbox-close { top: 20px; right: 20px; z-index: 1020; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">SoArt</div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="services.html">Services</a>
            <a href="portfolio.html" class="active">Portfolio</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container page-content">
        <h1>Réalisations</h1>
        <div class="grid portfolio-grid">
            
            <div class="card item">
                <div class="placeholder-img"></div>
                <h3>Villa Contemporaine</h3>
                <span>Nice, France</span>
            </div>
            
            <div class="card item clickable-card" id="open-gallery">
                <img src="IMG_0320 (1).jpg" onerror="this.onerror=null; this.src='IMG_0320 (1).JPG';" alt="Appartement Privé Antibes">
                <h3>Appartement Privé</h3>
                <span>Antibes, France</span>
            </div>
            
            <div class="card item">
                <div class="placeholder-img"></div>
                <h3>Espace Commercial</h3>
                <span>Cannes, France</span>
            </div>
            
            <div class="card item">
                <div class="placeholder-img"></div>
                <h3>Projet Résidentiel</h3>
                <span>Saint-Jean-Cap-Ferrat, France</span>
            </div>

        </div>
    </main>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <span class="lightbox-close" id="lightbox-close">&times;</span>
            <span class="lightbox-nav lightbox-prev" id="lightbox-prev">&#10094;</span>
            
            <img src="IMG_0320 (1).jpg" onerror="this.onerror=null; this.src='IMG_0320 (1).JPG';" class="lightbox-img active" alt="Chantier Antibes">
            <img src="IMG_0321 (1).jpg" onerror="this.onerror=null; this.src='IMG_0321 (1).JPG';" class="lightbox-img" alt="Chantier Antibes">
            <img src="IMG_0316 (1).jpg" onerror="this.onerror=null; this.src='IMG_0316 (1).JPG';" class="lightbox-img" alt="Chantier Antibes">
            <img src="IMG_0314 (1).jpg" onerror="this.onerror=null; this.src='IMG_0314 (1).JPG';" class="lightbox-img" alt="Chantier Antibes">
            <img src="IMG_0317 (1).jpg" onerror="this.onerror=null; this.src='IMG_0317 (1).JPG';" class="lightbox-img" alt="Chantier Antibes">
            <img src="IMG_0327 (1).jpg" onerror="this.onerror=null; this.src='IMG_0327 (1).JPG';" class="lightbox-img" alt="Chantier Antibes">
            <img src="IMG_0326 (1).jpg" onerror="this.onerror=null; this.src='IMG_0326 (1).JPG';" class="lightbox-img" alt="Chantier Antibes">
            <img src="IMG_0315 (1).jpg" onerror="this.onerror=null; this.src='IMG_0315 (1).JPG';" class="lightbox-img" alt="Chantier Antibes">
            <img src="IMG_0319 (1).jpg" onerror="this.onerror=null; this.src='IMG_0319 (1).JPG';" class="lightbox-img" alt="Chantier Antibes">
            <img src="IMG_0322 (1).jpg" onerror="this.onerror=null; this.src='IMG_0322 (1).JPG';" class="lightbox-img" alt="Chantier Antibes">

            <span class="lightbox-nav lightbox-next" id="lightbox-next">&#10095;</span>
        </div>
    </div>

    <footer>
        <p>&copy; SoArt Atelier Côte d'Azur</p>
    </footer>

    <script>
        let currentIndex = 0;

        const openBtn = document.getElementById('open-gallery');
        const lightbox = document.getElementById('lightbox');
        const closeBtn = document.getElementById('lightbox-close');
        const prevBtn = document.getElementById('lightbox-prev');
        const nextBtn = document.getElementById('lightbox-next');
        
        // On récupère directement les éléments du DOM pré-chargés
        const slideImages = document.querySelectorAll('.lightbox-img');

        function changeSlide(nextIndex) {
            // Retire la classe active de l'ancienne image
            slideImages[currentIndex].classList.remove('active');
            // Met à jour l'index
            currentIndex = nextIndex;
            // Ajoute la classe active sur la nouvelle image
            slideImages[currentIndex].classList.add('active');
        }

        openBtn.addEventListener('click', () => {
            changeSlide(0); // Ouvre toujours sur la première (IMG_0320)
            lightbox.style.display = 'flex';
        });

        closeBtn.addEventListener('click', () => {
            lightbox.style.display = 'none';
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.style.display = 'none';
            }
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            let next = (currentIndex + 1) % slideImages.length;
            changeSlide(next);
        });

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            let prev = (currentIndex - 1 + slideImages.length) % slideImages.length;
            changeSlide(prev);
        });

        document.addEventListener('keydown', (e) => {
            if (lightbox.style.display === 'flex') {
                if (e.key === 'ArrowRight') nextBtn.click();
                if (e.key === 'ArrowLeft') prevBtn.click();
                if (e.key === 'Escape') closeBtn.click();
            }
        });
    </script>
</body>
</html>
