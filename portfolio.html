    <style>
        /* Styles pour le diaporama (Lightbox) */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(17, 17, 17, 0.95);
            align-items: center;
            justify-content: center;
        }
        .lightbox-content {
            position: relative;
            max-width: 85%;
            max-height: 85%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lightbox-img {
            display: none;
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .lightbox-img.active {
            display: block;
        }
        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            font-weight: 300;
            transition: opacity 0.2s;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 35px;
            cursor: pointer;
            user-select: none;
            background: rgba(0,0,0,0.2);
            padding: 10px 15px;
            transition: background 0.2s;
            z-index: 1010;
        }
        .lightbox-prev { left: -60px; }
        .lightbox-next { right: -60px; }
        .lightbox-nav:hover, .lightbox-close:hover { opacity: 0.7; }
        
        /* Ajustement des cartes cliquables */
        .clickable-card {
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .clickable-card:hover {
            transform: translateY(-2px);
        }
        .clickable-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 768px) {
            .lightbox-prev { left: 10px; background: rgba(0,0,0,0.5); }
            .lightbox-next { right: 10px; background: rgba(0,0,0,0.5); }
            .lightbox-close { top: 20px; right: 20px; z-index: 1020; }
        }
    </style>
</head>
