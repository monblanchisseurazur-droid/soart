<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | SoArt Atelier</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="brand-logo">
            <span class="main-title">SoArt</span>
            <span class="sub-title-1">ATELIER</span>
            <span class="sub-title-2">CÔTE D'AZUR</span>
        </div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="services.html">Services</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main class="container page-content">
        <div class="contact-wrapper">
            <div class="contact-info">
                <h1>Étude de votre projet</h1>
                <p>Nos équipes interviennent sur toute la Côte d'Azur pour analyser la faisabilité technique de vos travaux de rénovation et d'agencement.</p>
            </div>
            <form class="form-project">
                <div class="form-group">
                    <label for="name">Nom / Raison Sociale</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="phone">Téléphone</label>
                    <input type="tel" id="phone">
                </div>
                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Nature des travaux & surface estimée</label>
                    <textarea id="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-submit">Soumettre le projet</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; SoArt Atelier Côte d'Azur — Architecture & Rénovation</p>
    </footer>
</body>
</html>
